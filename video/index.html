<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>산불추적기 15초 시연</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Pretendard"; src: url("assets/PretendardVariable.woff2") format("woff2"); font-weight: 100 900; }
      body { margin: 0; background: #07080c; font-family: "Pretendard", sans-serif; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #07080c; }
      #vw { position: absolute; inset: 0; transform-origin: 50% 50%; }
      #vw video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .cap-clip { position: absolute; inset: 0; pointer-events: none; }
      .cap { position: absolute; left: 72px; top: 60px; color: #fff; text-shadow: 0 2px 14px rgba(0, 0, 0, 0.85); }
      .kicker { font-size: 26px; font-weight: 600; color: #f0a48f; letter-spacing: 1px; }
      .title { font-size: 68px; font-weight: 800; line-height: 1.14; margin-top: 8px; letter-spacing: -1.5px; max-width: 1100px; }
      .title b { color: #ff8a5c; font-weight: 800; }
      .sub { font-size: 26px; color: #d9d2c5; margin-top: 12px; font-weight: 500; }
      .stat { position: absolute; left: 72px; bottom: 70px; color: #fff; text-shadow: 0 2px 14px rgba(0, 0, 0, 0.85); }
      .stat .k { font-size: 24px; color: #f0a48f; font-weight: 600; letter-spacing: 1px; }
      .stat .v { font-size: 120px; font-weight: 900; line-height: 1; letter-spacing: -3px; margin-top: 4px; font-variant-numeric: tabular-nums; }
      .stat .v small { font-size: 44px; font-weight: 700; margin-left: 8px; letter-spacing: 0; color: #ffd1bf; }
      .stat .d { font-size: 24px; color: #d9d2c5; margin-top: 8px; }
      .bar { position: absolute; left: 72px; bottom: 54px; height: 6px; width: 0; background: linear-gradient(90deg, #ffd166, #ff6b00); border-radius: 3px; box-shadow: 0 0 18px rgba(255, 107, 0, 0.8); }
      #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
      #fade { position: absolute; inset: 0; background: #07080c; opacity: 0; pointer-events: none; }
      #endcard { position: absolute; inset: 0; background: #07080c; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; }
      .logo { font-size: 108px; font-weight: 900; letter-spacing: -2px; display: flex; align-items: center; gap: 28px; }
      .tri { width: 0; height: 0; border-left: 48px solid transparent; border-right: 48px solid transparent; border-bottom: 84px solid #d84c2e; }
      .url { font-size: 46px; font-weight: 600; color: #ff8a5c; margin-top: 22px; }
      .srcs { font-size: 24px; color: #9e9a92; margin-top: 30px; letter-spacing: 0.3px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080" data-duration="15">
      <div id="vw"><video id="v1" src="assets/cinema.mp4" data-start="0" data-duration="13.5" muted playsinline data-track-index="0"></video></div>

      <!-- opening: fast-forward from ignition to 3/25 -->
      <section class="cap-clip clip" data-start="0.2" data-duration="2.7" data-track-index="1">
        <div class="cap" id="c1">
          <div class="kicker">2025년 3월 · 경북 의성</div>
          <div class="title">불은 어떻게 <b>60 km</b>를 갔나</div>
          <div class="sub">위성이 본 산불의 이동, 10분 단위</div>
        </div>
      </section>

      <!-- the run: one stat, lands when the fastest hour begins (17:20 ≈ 6.1 s) -->
      <section class="cap-clip clip" data-start="5.8" data-duration="5.0" data-track-index="1">
        <div class="stat" id="s1">
          <div class="k">가장 빨랐던 1시간 · 17:20 → 18:20</div>
          <div class="v"><span id="s1v">0.0</span><small>km/h</small></div>
          <div class="d">선두가 43 km에서 58 km로 · 바람과 같은 방향</div>
        </div>
        <div class="bar" id="bar"></div>
      </section>

      <!-- pull back -->
      <section class="cap-clip clip" data-start="11.0" data-duration="2.5" data-track-index="1">
        <div class="cap" id="c3">
          <div class="kicker">3월 25일 오후</div>
          <div class="title">3시간 동안 <b>33 km</b></div>
          <div class="sub">극궤도 위성의 12시간 공백을 천리안위성 2A호가 메웠다</div>
        </div>
      </section>

      <section class="clip" id="endcard" data-start="13.5" data-duration="1.5" data-track-index="2">
        <div class="logo" id="logo"><div class="tri"></div><span>산불추적기</span></div>
        <div class="url" id="url">seohosung.com/firetrace</div>
        <div class="srcs" id="srcs">NASA FIRMS · 천리안위성 2A호(기상청) · 산림청 · Open-Meteo ERA5</div>
      </section>

      <div id="fade"></div>
      <div id="flash"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // opening fade from black, slow push-in across the whole take
      tl.fromTo("#fade", { opacity: 1 }, { opacity: 0, duration: 0.8, ease: "power2.out" }, 0);
      tl.fromTo("#vw", { scale: 1.0 }, { scale: 1.035, duration: 13.5, ease: "none" }, 0);
      // captions
      tl.fromTo("#c1", { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 0.3);
      tl.to("#c1", { opacity: 0, y: -12, duration: 0.35, ease: "power2.in" }, 2.5);
      tl.fromTo("#s1", { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 5.9);
      // count the speed up as the fastest hour plays out (17:20 → 18:20 ≈ 6.1 → 7.4 s of footage)
      const sv = { v: 0 };
      tl.to(sv, { v: 15.6, duration: 1.4, ease: "power2.out", onUpdate: () => { document.getElementById("s1v").textContent = sv.v.toFixed(1); } }, 6.1);
      tl.fromTo("#bar", { width: 0 }, { width: 520, duration: 1.4, ease: "power2.out" }, 6.1);
      tl.to("#s1", { opacity: 0, duration: 0.3 }, 10.5);
      tl.to("#bar", { opacity: 0, duration: 0.3 }, 10.5);
      tl.fromTo("#c3", { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 11.2);
      tl.to("#c3", { opacity: 0, duration: 0.3 }, 13.2);
      // end: cut flash into the card
      tl.fromTo("#flash", { opacity: 0 }, { opacity: 0.5, duration: 0.06, ease: "none" }, 13.44);
      tl.to("#flash", { opacity: 0, duration: 0.3, ease: "power2.out" }, 13.5);
      tl.fromTo("#logo", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 13.6);
      tl.fromTo("#url", { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 13.85);
      tl.fromTo("#srcs", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 14.05);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
